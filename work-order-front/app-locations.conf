root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # 前後端共用同一個入口，這 3 個路徑前端頁面路由跟後端 API 剛好撞路徑，
    # 用 method 判斷分流：GET（瀏覽器直接開頁面/重新整理）交給前端 SPA 處理，
    # 其他 method（POST 等，都是 axios 呼叫 API）轉發給後端。
    # ------------------------------------------------------------------
    location = /auth/login {
        if ($request_method = GET) {
            rewrite ^ /index.html break;
        }
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location = /auth/register {
        if ($request_method = GET) {
            rewrite ^ /index.html break;
        }
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location = /auth/reset-password {
        if ($request_method = GET) {
            rewrite ^ /index.html break;
        }
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # ------------------------------------------------------------------
    # 其餘 /auth/** 沒有對應的前端頁面路由，不會撞路徑，直接轉發後端即可
    # （refresh、logout、oauth2/session、forgot-password 等）
    # ------------------------------------------------------------------
    location /auth/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # 一般 REST API
    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # 沒掛在 /api/ 底下的 controller（UserController /users、AccountController /account、
    # WorkOrderDetail /order/detail），一樣要轉發給後端，不然會掉進最後的 SPA fallback
    location /users {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location /account/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location /order/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # Spring Security OAuth2 內建端點（授權導向、Google callback 等）
    location /oauth2/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # WebSocket（通知功能），需要額外的 Upgrade/Connection header 才能升級連線
    location /ws/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 前端靜態資源，有實體檔案就直接回，找不到就交給 index.html 讓 Vue Router 接手（SPA fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }
