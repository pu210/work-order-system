root /usr/share/nginx/html;
    index index.html;

    # 一般 REST API
    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # Spring Security OAuth2 內建端點（授權導向、Google callback 等）
    location /oauth2/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    location /login/oauth2/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
    }

    # WebSocket（通知功能），需要額外的 Upgrade/Connection header 才能升級連線
    location /ws/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_params.conf;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 前端靜態資源，有實體檔案就直接回，找不到就交給 index.html 讓 Vue Router 接手（SPA fallback）
    location / {
        try_files $uri $uri/ /index.html;
    }
