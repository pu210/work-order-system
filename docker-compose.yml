services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: work-order-db
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_SA_PASSWORD}
    ports:
      - "${DB_PORT:-1433}:1433" # 本機開發方便用 SSMS/DBeaver 連進去看資料，正式環境建議拿掉
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - work-order-net

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: work-order-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_SA_PASSWORD: ${DB_SA_PASSWORD}
    volumes:
      - ./docker/db/init:/init:ro
    networks:
      - work-order-net
    # 建資料庫（若不存在）→ 依檔名順序跑 /init 底下「所有」 .sql 檔案。
    # 之後要加假資料/新的 migration，丟一支新檔案進 docker/db/init/（例如 02-seed.sql）就會自動被執行，
    # 不用再改這裡；檔名數字前綴決定執行順序。
    entrypoint: >
      bash -c "
      /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$DB_SA_PASSWORD\" -C -Q \"IF DB_ID('workorderDB') IS NULL CREATE DATABASE workorderDB\" &&
      for f in /init/*.sql; do
        echo \"執行 $$f\";
        /opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$$DB_SA_PASSWORD\" -C -d workorderDB -i \"$$f\" || exit 1;
      done
      "
    restart: "no"

  backend:
    build:
      context: ./work-order-backend
    image: work-order-backend
    container_name: work-order-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_SA_PASSWORD: ${DB_SA_PASSWORD}
      JWT_TOKEN_SECRET: ${JWT_TOKEN_SECRET}
      JWT_TOKEN_EXPIRE: ${JWT_TOKEN_EXPIRE:-10}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost,https://localhost:*,http://localhost,http://localhost:*,https://127.0.0.1,https://127.0.0.1:*,http://127.0.0.1,http://127.0.0.1:*}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/google}
    ports:
      - "${BACKEND_PORT:-8080}:8080" # 之後接上前端反代後可以拿掉，先開著方便直接測 API
    networks:
      - work-order-net

  frontend:
    build:
      context: ./work-order-front
      args:
        # 空字串：axios baseURL 走相對路徑，由 nginx 反向代理轉發給 backend（見 axios.js 的 ?? 判斷）
        VITE_API_URL: ""
    image: work-order-frontend
    container_name: work-order-frontend
    depends_on:
      - backend
    # 不對外開 port：HTTPS 由前面的 caddy 負責，frontend 只在內部網路被 caddy 連到
    networks:
      - work-order-net

  caddy:
    image: caddy:2-alpine
    container_name: work-order-caddy
    depends_on:
      - frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_HTTPS_PORT:-443}:443"
    environment:
      # 沒設或空字串都會用 localhost（本機測試用 Caddy 內建的 CA）；
      # 真的有網域時在 .env 設 DOMAIN=your-domain.com，Caddy 會自動改用 Let's Encrypt。
      # 預設值故意寫在這裡（不是 Caddyfile 裡），因為 docker compose 的 ${VAR:-default}
      # 對「空字串」也會套用預設值，Caddyfile 自己的 {$VAR:default} 語法只認「完全沒設定」
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - work-order-net

networks:
  work-order-net:
    driver: bridge

volumes:
  mssql_data:
  caddy_data:
  caddy_config:
