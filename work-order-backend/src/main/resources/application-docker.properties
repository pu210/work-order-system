spring.application.name=repair-system

# Multipart 上傳（附件），沒設定時 Spring Boot 預設只有 1MB，跟後端驗證邏輯（10MB）與前端提示對不上
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# JWT
jwt.token.secret=${JWT_TOKEN_SECRET}
jwt.token.expire=${JWT_TOKEN_EXPIRE:10}
refresh.token.expire-days=${REFRESH_TOKEN_EXPIRE_DAYS:7}
refresh.cookie.secure=${REFRESH_COOKIE_SECURE:false}

# JSON
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Taipei

# JPA
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Database — docker-compose network 內用 service 名稱 db 連線，帳號固定用 sa
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.datasource.url=jdbc:sqlserver://db:1433;encrypt=true;trustServerCertificate=true;database=workorderDB;
spring.datasource.username=sa
spring.datasource.password=${DB_SA_PASSWORD}

# 前端網址（寄信連結、OAuth2 登入成功導向用）與 CORS 允許清單
app.frontend-url=${FRONTEND_URL}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGINS}
app.password-reset-url=${FRONTEND_URL}/reset-password

# Mail（留空只會讓忘記密碼寄信失效，不影響啟動）
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Google OAuth2 登入
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
